# Copy to /etc/nginx/sites-available/ordertrade-ai on the server, then:
#   nginx -t && systemctl restart nginx
#
# UPDATED 2026-08-27: added a /saas/ location so the multi-user SaaS
# dashboard (saas_app.py, served locally on 127.0.0.1:8502 by
# saas-app.service) is reachable through the SAME server block as the
# single-owner dashboard -- same IP, same port 80, same basic-auth
# protection -- rather than needing its own domain/port/cert. This is
# additive only: the existing "/" location (single-owner dashboard,
# port 8501) is untouched.
#
# The /saas/ location requires saas-app.service's ExecStart to pass
# --server.baseUrlPath=saas to Streamlit (see deploy/saas-app.service) --
# without that flag, Streamlit's own static assets (JS/CSS/websocket
# stream) would still try to load from "/" and the page would render
# broken. proxy_pass below deliberately has NO trailing path after the
# host:port -- that tells nginx to forward the full incoming URI
# (including "/saas/...") to Streamlit unchanged, which is exactly what
# a baseUrlPath-configured Streamlit instance expects.

server {
    listen 80;
    server_name 159.223.226.4;

    auth_basic "OrderTrade AI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /saas/ {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
