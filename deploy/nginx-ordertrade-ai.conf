# Copy to /etc/nginx/sites-available/ordertrade-ai on the server, then:
#   ln -s /etc/nginx/sites-available/ordertrade-ai /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl restart nginx
#
# Replace YOUR_SERVER_IP with your droplet's actual IP address.

server {
    listen 80;
    server_name YOUR_SERVER_IP;

    auth_basic "OrderTrade AI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
