# This is the REAL live config on the droplet as of 2026-08-27, captured
# directly via `cat /etc/nginx/sites-enabled/ordertrade-ai` -- the
# previous version of this checked-in file was stale/wrong (a plain-HTTP,
# bare-IP-only template that did NOT match production, which actually
# runs HTTPS via Certbot on a real domain: ordertradeai.adeyemiadegbenro.com).
# Deploying that stale file overwrote the real Certbot-managed config and
# broke the live site. Lesson: never scp a checked-in copy of this file
# to the server again without first `cat`-ing the live file to confirm
# it still matches -- Certbot edits this file in place (adding the 443
# server block, the ssl_certificate lines, and the port-80-redirect
# block) whenever a cert renews or is reconfigured, so the live file can
# drift from whatever was last checked in here.
#
# To apply changes to this file on the server:
#   scp deploy/nginx-ordertrade-ai.conf root@159.223.226.4:/etc/nginx/sites-enabled/ordertrade-ai
#   ssh root@159.223.226.4
#   nginx -t && systemctl restart nginx
#
# UPDATED 2026-08-27: added a /saas/ location (inside the HTTPS server
# block, NOT the port-80 redirect block) so the multi-user SaaS dashboard
# (saas_app.py, served locally on 127.0.0.1:8502 by saas-app.service) is
# reachable at https://ordertradeai.adeyemiadegbenro.com/saas/ -- same
# domain, same cert, same basic-auth protection as the single-owner
# dashboard. Additive only: the existing "/" location (port 8501) is
# untouched.
#
# The /saas/ location requires saas-app.service's ExecStart to pass
# --server.baseUrlPath=saas to Streamlit (see deploy/saas-app.service) --
# without that flag, Streamlit's own static assets/websocket stream
# would still request from "/" and the page would render broken.
# proxy_pass below deliberately has NO trailing path after the host:port
# -- that tells nginx to forward the full incoming URI (including
# "/saas/...") to Streamlit unchanged, which is exactly what a
# baseUrlPath-configured Streamlit instance expects.

server {
    server_name ordertradeai.adeyemiadegbenro.com 159.223.226.4;

    auth_basic "OrderTrade AI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /saas/ {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ordertradeai.adeyemiadegbenro.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ordertradeai.adeyemiadegbenro.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = ordertradeai.adeyemiadegbenro.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ordertradeai.adeyemiadegbenro.com 159.223.226.4;
    return 404; # managed by Certbot


}
