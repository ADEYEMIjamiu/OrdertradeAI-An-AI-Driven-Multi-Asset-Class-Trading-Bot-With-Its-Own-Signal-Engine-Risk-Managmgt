# ordertradeai.com -- the public multi-user SaaS product domain,
# deliberately separate from deploy/nginx-ordertrade-ai.conf (that file
# is ordertradeai.adeyemiadegbenro.com, your own private single-owner
# bot's dashboard, still gated behind basic auth). This domain is
# public on purpose -- saas_app.py's own login/signup screen (bcrypt
# password hashes, see engines/tenant_engine.py) is the real gate here,
# not a shared nginx password, since real users need to reach the Sign
# Up form without you handing out a password first.
#
# STEP 2 of 2 (this version): the real HTTPS server, now that the
# certificate exists (`certbot certonly --webroot -w /var/www/html -d
# ordertradeai.com -d www.ordertradeai.com`, run 2026-08-27). www is
# treated as an alias that redirects to the apex domain -- one
# canonical URL rather than two copies of the same site existing at
# different addresses.
#
# UPDATED 2026-08-28: root ("/") now serves the static marketing
# landing page (landing/index.html) instead of proxying straight to
# saas_app.py. The app moved to /app (saas-app.service's ExecStart
# grew --server.baseUrlPath=app back to match, see that file's own
# history for why this isn't the same reason the old --saas prefix was
# dropped). Anyone landing on the bare domain now sees a sales page
# with a Start Free Trial / Sign In button, not a login form.
#
# Deploy target: /etc/nginx/sites-enabled/ordertradeai-com (same file
# this step-1 version was deployed to -- this replaces it in place).
#   scp deploy/nginx-ordertradeai-com.conf root@159.223.226.4:/etc/nginx/sites-enabled/ordertradeai-com
#   nginx -t && systemctl restart nginx
# Landing page files deploy separately, to /var/www/ordertradeai-landing/
# (see landing/index.html's own deploy note).
#
# Certbot will edit the ssl_certificate lines / add renewal hooks in
# place over time -- same drift risk documented in
# nginx-ordertrade-ai.conf's header. Always `cat` the live file before
# assuming this checked-in copy still matches production.

server {
    listen 80;
    listen [::]:80;
    server_name ordertradeai.com www.ordertradeai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ordertradeai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ordertradeai.com;

    ssl_certificate /etc/letsencrypt/live/ordertradeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordertradeai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ordertradeai.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ordertradeai.com;

    ssl_certificate /etc/letsencrypt/live/ordertradeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordertradeai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Stripe webhook receiver -- a SEPARATE process (saas_webhook_server.py,
    # Starlette/uvicorn on 127.0.0.1:8503, see deploy/saas-webhook.service),
    # not Streamlit. Matched before the catch-all "/" below since nginx
    # picks the most specific matching location. Stripe signs every
    # request itself (verified inside saas_webhook_server.py), so this
    # route is deliberately public/unauthenticated at the nginx layer --
    # anyone can POST here, but only a request signed with the real
    # STRIPE_WEBHOOK_SECRET will be accepted.
    location = /webhooks/stripe {
        proxy_pass http://127.0.0.1:8503;
        proxy_set_header Host $host;
    }

    # The app itself, moved off the domain root -- see this file's
    # header comment.
    #
    # FIXED 2026-09-01: this used to be a single bare "location /app"
    # (no trailing slash). nginx's prefix matching is a literal string
    # prefix, not a path-segment match -- "/app" is a prefix of
    # "/apple-touch-icon.png" too, so that one location was silently
    # swallowing any static file whose name happened to start with
    # "app" (discovered when apple-touch-icon.png 404'd with Streamlit's
    # own "Not Found" body instead of nginx's, meaning the request had
    # been proxied into Streamlit instead of served as a static file).
    # Splitting into an exact match for the bare "/app" request plus a
    # prefix match for "/app/..." closes that gap while keeping the
    # same proxy_pass (no path of its own, so the full original URI
    # forwards through unchanged) that Streamlit expects since it was
    # started with --server.baseUrlPath=app (see deploy/saas-app.service).
    location = /app {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    location /app/ {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Streamlit's own frontend JS fires an early connection-health check
    # (/_stcore/host-config, /_stcore/health) against the bare domain
    # root BEFORE it has read its own /app base path from the served
    # page -- a client-side quirk, not something fixable from
    # saas_app.py. Without this block those bare requests 404 against
    # the landing page below, and the brief "Connection failed" banner
    # that causes is what showed up as a flash of an error page before
    # the real app rendered. The trailing slash on both the location
    # and proxy_pass target matters here: nginx then replaces the
    # "/_stcore/" prefix with "/app/_stcore/" when forwarding, landing
    # on the route Streamlit actually has registered, instead of
    # forwarding the bare path through unchanged.
    location /_stcore/ {
        proxy_pass http://127.0.0.1:8502/app/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Marketing landing page (landing/index.html) -- a single static
    # file, no build step, served directly by nginx rather than
    # through any app process. Deployed separately from this repo
    # checkout; see landing/index.html's own deploy note for the scp
    # command.
    location / {
        root /var/www/ordertradeai-landing;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
