# ordertradeai.com -- the public multi-user SaaS product domain,
# deliberately separate from deploy/nginx-ordertrade-ai.conf (that file
# is ordertradeai.adeyemiadegbenro.com, your own private single-owner
# bot's dashboard, still gated behind basic auth). This domain is
# public on purpose -- saas_app.py's own login/signup screen (bcrypt
# password hashes, see engines/tenant_engine.py) is the real gate here,
# not a shared nginx password, since real users need to reach the Sign
# Up form without you handing out a password first.
#
# STEP 2 of 2 (this version): the real HTTPS server, now that the
# certificate exists (`certbot certonly --webroot -w /var/www/html -d
# ordertradeai.com -d www.ordertradeai.com`, run 2026-08-27). www is
# treated as an alias that redirects to the apex domain -- one
# canonical URL rather than two copies of the same site existing at
# different addresses.
#
# Proxies straight to saas_app.py on 127.0.0.1:8502 at the domain
# root -- saas-app.service's ExecStart had --server.baseUrlPath=saas
# removed to match (see deploy/saas-app.service's own history) now
# that this app has its own dedicated domain instead of living under
# ordertradeai.adeyemiadegbenro.com/saas/. That old subpath is retired
# and now just redirects here -- see deploy/nginx-ordertrade-ai.conf.
#
# Deploy target: /etc/nginx/sites-enabled/ordertradeai-com (same file
# this step-1 version was deployed to -- this replaces it in place).
#   scp deploy/nginx-ordertradeai-com.conf root@159.223.226.4:/etc/nginx/sites-enabled/ordertradeai-com
#   nginx -t && systemctl restart nginx
#
# Certbot will edit the ssl_certificate lines / add renewal hooks in
# place over time -- same drift risk documented in
# nginx-ordertrade-ai.conf's header. Always `cat` the live file before
# assuming this checked-in copy still matches production.

server {
    listen 80;
    listen [::]:80;
    server_name ordertradeai.com www.ordertradeai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://ordertradeai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ordertradeai.com;

    ssl_certificate /etc/letsencrypt/live/ordertradeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordertradeai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://ordertradeai.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ordertradeai.com;

    ssl_certificate /etc/letsencrypt/live/ordertradeai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ordertradeai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8502;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
