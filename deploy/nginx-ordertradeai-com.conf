# ordertradeai.com -- the public multi-user SaaS product domain,
# deliberately separate from deploy/nginx-ordertrade-ai.conf (that file
# is ordertradeai.adeyemiadegbenro.com, your own private single-owner
# bot's dashboard, still gated behind basic auth). This domain is
# public on purpose -- saas_app.py's own login/signup screen (bcrypt
# password hashes, see engines/tenant_engine.py) is the real gate here,
# not a shared nginx password, since real users need to reach the Sign
# Up form without you handing out a password first.
#
# STEP 1 of 2 (this version): HTTP-only, just enough for Certbot's
# webroot ACME challenge to succeed. Deploy this FIRST, confirm nginx
# reloads clean, THEN run:
#   mkdir -p /var/www/html
#   certbot certonly --webroot -w /var/www/html \
#     -d ordertradeai.com -d www.ordertradeai.com
# Only after that cert exists does the STEP 2 version (with the real
# 443 server block, proxying to saas_app.py on 127.0.0.1:8502) get
# deployed over this one -- see the follow-up commit for that version.
#
# Deploy target: /etc/nginx/sites-enabled/ordertradeai-com (a NEW file,
# separate from sites-enabled/ordertrade-ai -- do not merge these, one
# process manages the single-owner bot's proven-working config, the
# other is this new domain's, so a mistake in one can never take down
# the other).

server {
    listen 80;
    listen [::]:80;
    server_name ordertradeai.com www.ordertradeai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
